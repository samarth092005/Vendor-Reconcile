<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Statement OCR POC</title>
    <!-- 1. Load the Tesseract library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f6f9; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #0b1b4d; }
        .split-screen { display: flex; gap: 20px; margin-top: 20px; }
        .left-panel, .right-panel { flex: 1; border: 1px solid #e3e9fa; padding: 20px; border-radius: 8px; background: #fafbfc; }
        .upload-btn { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .upload-btn:hover { background: #1d4ed8; }
        #imagePreview { max-width: 100%; height: auto; margin-top: 15px; border: 1px dashed #ccc; display: none; }
        .progress-bar { height: 20px; background: #e5e7eb; border-radius: 10px; overflow: hidden; margin-top: 15px; display: none; }
        .progress-fill { height: 100%; width: 0%; background: #34d399; transition: width 0.2s; }
        #statusText { font-size: 14px; color: #5b6396; margin-top: 5px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #0b1b4d; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>Data Intake: OCR Vendor Statement</h2>
    <p>Upload a PDF or Image statement to automatically extract data using the highly accurate <code>tessdata_best</code> model.</p>
    
    <input type="file" id="fileUpload" accept="image/*" style="display: none;" />
    <button class="upload-btn" onclick="document.getElementById('fileUpload').click()">📷 Upload Scanned Statement</button>

    <div class="split-screen">
        <!-- LEFT SIDE: The Image -->
        <div class="left-panel">
            <h3>Document Viewer</h3>
            <img id="imagePreview" />
        </div>

        <!-- RIGHT SIDE: The Data -->
        <div class="right-panel">
            <h3>Extracted Data</h3>
            
            <div class="progress-bar" id="progressBarContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="statusText">Waiting for document...</div>

            <div style="margin-top: 20px;">
                <div class="form-group">
                    <label>Raw OCR Output (PSM 6 & tessdata_best):</label>
                    <textarea id="rawOutput" rows="12" placeholder="The extracted text will appear here so you can verify it..."></textarea>
                </div>
            </div>
            <button class="upload-btn" style="width: 100%; background: #34d399; color: #0b1b4d;">Save & Park in SAP</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('fileUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        // 1. Show the image on the left side
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById('imagePreview');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);

        // 2. Prepare the UI
        document.getElementById('progressBarContainer').style.display = 'block';
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('statusText').innerText = 'Initializing tesseract.js engine...';
        document.getElementById('rawOutput').value = '';

        // 3. Run the OCR using tessdata_best and PSM 6
        Tesseract.recognize(
            file,
            'eng',
            { 
                // Log progress to the progress bar
                logger: m => {
                    if (m.status === 'recognizing text') {
                        let percent = (m.progress * 100).toFixed(0);
                        document.getElementById('progressFill').style.width = percent + '%';
                        document.getElementById('statusText').innerText = `Scanning Document: ${percent}%`;
                    } else {
                        document.getElementById('statusText').innerText = `Status: ${m.status}...`;
                    }
                },
                // Use the highly accurate "tessdata_best" model
                langPath: 'https://tessdata.projectnaptha.com/4.0.0_best'
            }
        ).then(async (worker) => {
            // Force PSM 6 (Assume a single uniform block of text) - great for tables/invoices!
            await worker.setParameters({
                tessedit_pageseg_mode: Tesseract.PSM.ASSUME_UNIFORM_BLOCK_OF_TEXT,
            });
            
            return worker;
        }).then(result => {
            // 4. Output the text!
            document.getElementById('statusText').innerText = '✅ Scan Complete!';
            document.getElementById('rawOutput').value = result.data.text;
        }).catch(err => {
            console.error(err);
            document.getElementById('statusText').innerText = '❌ Error during scan.';
        });
    });
</script>

</body>
</html>
